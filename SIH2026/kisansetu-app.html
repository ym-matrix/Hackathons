<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>KisanSetu — Team AgriNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F5EE; --surface:#FFFFFF; --ink:#1B2B22; --primary:#1E4738; --primary-d:#123128;
    --gold:#D9A441; --gold-d:#AD7C24; --rust:#C1502E; --sage:#DEE9D7; --sage-d:#C4D6BB;
    --muted:#65746A; --line:#E1E8DA; --danger-bg:#FBE7E1; --ok-bg:#EAF3E4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1712; --surface:#172520; --ink:#EAF1E6; --primary:#7BC7A2; --primary-d:#0B140F;
      --gold:#E7B65B; --gold-d:#C99A3E; --rust:#E28A6E; --sage:#22352A; --sage-d:#2C4736;
      --muted:#9AAA9E; --line:#28382E; --danger-bg:#3A2420; --ok-bg:#1E3226;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1712; --surface:#172520; --ink:#EAF1E6; --primary:#7BC7A2; --primary-d:#0B140F;
    --gold:#E7B65B; --gold-d:#C99A3E; --rust:#E28A6E; --sage:#22352A; --sage-d:#2C4736;
    --muted:#9AAA9E; --line:#28382E; --danger-bg:#3A2420; --ok-bg:#1E3226;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Poppins','Noto Sans Devanagari',sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 12px 40px;}
  .wordmark{font-family:'Fraunces',serif;}
  .page-head{text-align:center;margin-bottom:10px;}
  .page-head .brandrow{display:flex;align-items:center;justify-content:center;gap:8px;}
  .page-head h1{font-size:26px;margin:0;color:var(--primary);}
  .page-head .tag{font-size:12px;color:var(--muted);margin-top:2px;}
  .team-ribbon{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--primary-d);
    font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:8px;}

  .phone{
    width:min(400px, 94vw); background:var(--bg); border-radius:34px; border:8px solid var(--primary-d);
    box-shadow:0 24px 50px rgba(18,49,40,0.28); overflow:hidden; position:relative;
    display:flex; flex-direction:column; height:min(800px, 82vh); min-height:640px;
  }
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 2px;
    font-size:11px;font-weight:600;color:var(--ink);}
  .statusbar .dot-row{width:60px;height:12px;border-radius:8px;background:var(--primary-d);}

  .header{padding:6px 16px 10px;border-bottom:1px solid var(--line);}
  .header .top{display:flex;justify-content:space-between;align-items:center;}
  .brand{display:flex;align-items:center;gap:6px;}
  .brand .name{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--primary);}
  .brand .sub{font-size:9px;color:var(--muted);margin-top:-2px;}
  .iconbtn{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
  .segrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
  .seg{display:flex;background:var(--sage);border-radius:999px;padding:3px;flex:1;}
  .seg button{flex:1;border:none;background:transparent;padding:6px 4px;border-radius:999px;font-size:11.5px;
    font-weight:700;cursor:pointer;color:var(--primary);transition:all .25s ease;font-family:'Poppins',sans-serif;}
  .seg button.on{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(18,49,40,.25);}
  .langseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;}
  .langseg button{border:none;background:transparent;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;
    cursor:pointer;color:var(--muted);font-family:'Poppins','Noto Sans Devanagari',sans-serif;line-height:1;}
  .langseg button.on{background:var(--gold);color:var(--primary-d);}

  .content{flex:1;overflow-y:auto;padding:14px 16px 90px;position:relative;}
  .screen{}
  .content.anim .screen{animation:fadeSlide .35s ease;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  h2.title{font-family:'Fraunces',serif;font-size:19px;margin:0 0 12px;color:var(--ink);}
  .label{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:6px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--muted);}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .btn{border:none;border-radius:14px;padding:12px 16px;font-weight:700;font-size:13.5px;cursor:pointer;
    font-family:'Poppins',sans-serif;transition:transform .12s ease, box-shadow .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--gold);color:var(--primary-d);width:100%;}
  .btn-outline{background:var(--sage);color:var(--primary);width:100%;}
  .btn-dark{background:var(--primary);color:#fff;width:100%;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  .chipsrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
  .chipsrow::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;cursor:pointer;transition:all .2s ease;min-width:64px;}
  .chip.on{border-color:var(--primary);background:var(--sage);}
  .chip .em{font-size:20px;}
  .chip .nm{font-size:10px;font-weight:600;color:var(--ink);}

  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--rust);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(193,80,46,.5);}70%{box-shadow:0 0 0 7px rgba(193,80,46,0);}100%{box-shadow:0 0 0 0 rgba(193,80,46,0);}}

  .spark-line{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1);}
  .bar-fill{transition:height .8s cubic-bezier(.2,.7,.2,1), width .8s cubic-bezier(.2,.7,.2,1);}
  .count{transition:none;}

  .stepper{display:flex;flex-direction:column;gap:0;}
  .step{display:flex;align-items:flex-start;gap:10px;position:relative;padding-bottom:16px;}
  .step:last-child{padding-bottom:0;}
  .step .connector{position:absolute;left:13px;top:28px;bottom:-4px;width:2px;background:var(--line);}
  .step:last-child .connector{display:none;}
  .step.done .connector{background:var(--primary);}
  .stepdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;flex-shrink:0;background:var(--line);color:var(--muted);transition:all .35s ease;z-index:1;}
  .step.done .stepdot{background:var(--primary);color:#fff;transform:scale(1.05);}
  .step.active .stepdot{background:var(--gold);color:var(--primary-d);animation:ringpulse 1.6s infinite;}
  @keyframes ringpulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55);}70%{box-shadow:0 0 0 8px rgba(217,164,65,0);}100%{box-shadow:0 0 0 0 rgba(217,164,65,0);}}
  .steptext .t{font-size:13px;font-weight:700;color:var(--ink);}
  .steptext .d{font-size:11px;color:var(--muted);margin-top:1px;}

  .qrgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:1.5px;background:var(--ink);padding:6px;border-radius:8px;width:64px;}
  .qrgrid div{width:100%;padding-top:100%;}

  table.cmp{width:100%;border-collapse:collapse;font-size:11px;}
  table.cmp th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line);}
  table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);color:var(--ink);}
  table.cmp td.ok{color:var(--primary);font-weight:700;}
  table.cmp td.no{color:var(--rust);font-weight:700;}
  .tablewrap{overflow-x:auto;}

  .fab{position:absolute;right:16px;bottom:78px;width:52px;height:52px;border-radius:50%;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 18px rgba(217,164,65,.45);
    cursor:pointer;border:none;transition:transform .15s ease;z-index:20;}
  .fab:active{transform:scale(.92);}

  .navbar{display:flex;border-top:1px solid var(--line);background:var(--surface);position:absolute;left:0;right:0;bottom:0;}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;cursor:pointer;
    background:none;border:none;font-family:'Poppins',sans-serif;}
  .navitem .ic{font-size:18px;transition:transform .18s ease;}
  .navitem.on .ic{transform:scale(1.18);}
  .navitem .lb{font-size:9.5px;font-weight:700;color:var(--muted);}
  .navitem.on .lb{color:var(--primary);}

  .modal-bg{position:absolute;inset:0;background:rgba(11,23,15,.45);display:flex;align-items:flex-end;z-index:30;
    animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 22px;max-height:88%;
    overflow-y:auto;animation:slideUp .3s cubic-bezier(.2,.8,.2,1);}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 12px;}

  .toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--primary-d);color:#fff;padding:11px 14px;
    border-radius:14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:40;
    animation:toastIn .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 24px rgba(0,0,0,.25);}
  @keyframes toastIn{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .splash{position:absolute;inset:0;background:var(--primary-d);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;z-index:50;color:#fff;text-align:center;padding:20px;}
  .splash .logo{font-size:52px;animation:popIn .7s cubic-bezier(.2,.8,.2,1);}
  @keyframes popIn{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
  .splash .sname{font-family:'Fraunces',serif;font-size:26px;font-weight:700;animation:fadeSlide .6s .15s both;}
  .splash .stag{font-size:12px;color:#CFE3D6;animation:fadeSlide .6s .3s both;}
  .splash .steam{margin-top:10px;background:rgba(217,164,65,.18);border:1px solid rgba(217,164,65,.5);color:var(--gold);
    padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;animation:fadeSlide .6s .45s both;}
  .splash .enterbtn{margin-top:22px;background:var(--gold);color:var(--primary-d);border:none;padding:11px 26px;
    border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;animation:fadeSlide .6s .6s both;}

  /* ---------- v2 feature styles (reuse existing tokens) ---------- */
  .subseg{display:flex;background:var(--sage);border-radius:999px;padding:3px;margin-bottom:12px;}
  .subseg button{flex:1;border:none;background:transparent;padding:7px 4px;border-radius:999px;font-size:11.5px;
    font-weight:700;cursor:pointer;color:var(--primary);font-family:'Poppins','Noto Sans Devanagari',sans-serif;transition:all .25s ease;}
  .subseg button.on{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(18,49,40,.22);}

  .matchcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
  .matchcard.top{border-color:var(--gold);box-shadow:0 4px 14px rgba(217,164,65,.20);}
  .matchbar{height:6px;border-radius:6px;background:var(--sage);overflow:hidden;margin-top:8px;}
  .matchbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--primary));
    border-radius:6px;transition:width 1s cubic-bezier(.2,.7,.2,1);}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sage);color:var(--primary);}
  .badge.gold{background:var(--gold);color:var(--primary-d);}
  .ill{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:rgba(217,164,65,.18);color:var(--gold-d);letter-spacing:.02em;}

  .progbar{height:8px;border-radius:8px;background:var(--sage);overflow:hidden;}
  .progbar i{display:block;height:100%;width:0;background:var(--primary);border-radius:8px;transition:width .9s cubic-bezier(.2,.7,.2,1);}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0;}
  .kv>span:first-child{color:var(--muted);}
  .kv>span:last-child{font-weight:600;text-align:right;}

  .photo-tile{position:relative;border-radius:10px;background:var(--sage);border:1px solid var(--sage-d);
    display:flex;align-items:center;justify-content:center;font-size:20px;padding:12px 0;}
  .photo-tile b{position:absolute;bottom:2px;right:5px;font-size:8.5px;color:var(--primary);}
  .verifystamp{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--primary);color:var(--primary);
    border-radius:10px;padding:5px 10px;font-weight:700;font-size:11.5px;transform:rotate(-2deg);margin-top:8px;}

  .otpbox input{width:100%;text-align:center;letter-spacing:.45em;font-size:18px;font-weight:700;padding:10px;
    border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:'Poppins',sans-serif;}
  .otpbox input.bad{border-color:var(--rust);animation:shake .38s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .otpcode{font-family:'Fraunces',serif;font-size:26px;font-weight:700;letter-spacing:.22em;color:var(--primary);}

  .truckdot{animation:bob 1.1s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
  @media (prefers-reduced-motion: reduce){ .truckdot{animation:none;} }

  .cmpbars{display:flex;gap:12px;align-items:flex-end;height:104px;margin-top:10px;}
  .cmpcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;}
  .cmpcol .bx{width:100%;border-radius:10px 10px 0 0;height:0;transition:height 1s cubic-bezier(.2,.7,.2,1);}

  .demo-banner{position:absolute;left:10px;right:10px;top:30px;background:var(--primary-d);color:#fff;border-radius:14px;
    padding:8px 11px;z-index:45;display:flex;align-items:center;gap:9px;box-shadow:0 10px 22px rgba(0,0,0,.32);}
  .demo-banner .txt{flex:1;font-size:10.5px;font-weight:600;line-height:1.35;}
  .demo-banner .stepn{font-size:9px;color:var(--gold);font-weight:700;}
  .demo-banner button{background:var(--gold);border:none;color:var(--primary-d);font-weight:700;font-size:10px;
    padding:5px 10px;border-radius:999px;cursor:pointer;font-family:'Poppins',sans-serif;flex-shrink:0;}

  /* ---------- v3: auth, AI assistant, sheets ---------- */
  .auth{position:absolute;inset:0;background:var(--bg);z-index:48;display:flex;flex-direction:column;
    overflow-y:auto;padding:16px 16px 22px;animation:fadeSlide .3s ease;}
  .auth .ahead{text-align:center;margin-bottom:12px;}
  .auth .alogo{font-size:32px;}
  .auth h3{font-family:'Fraunces',serif;font-size:19px;margin:6px 0 2px;color:var(--ink);}
  .auth p.sub{font-size:11px;color:var(--muted);margin:0;}
  .field{margin-bottom:9px;}
  .field label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.02em;}
  .field input,.field select{width:100%;padding:10px 11px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:12.5px;font-family:'Poppins','Noto Sans Devanagari',sans-serif;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);}
  .field.bad input,.field.bad select{border-color:var(--rust);background:var(--danger-bg);}
  .ferr{font-size:10px;color:var(--rust);margin-top:3px;font-weight:600;}
  .steps-dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px;}
  .steps-dots i{width:24px;height:4px;border-radius:4px;background:var(--line);transition:background .3s;}
  .steps-dots i.on{background:var(--primary);}
  .kycrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);}
  .kycrow:last-child{border-bottom:none;}
  .kycrow .kic{width:26px;height:26px;border-radius:50%;background:var(--sage);display:flex;align-items:center;
    justify-content:center;font-size:12px;flex-shrink:0;transition:all .3s;}
  .kycrow.ok .kic{background:var(--primary);color:#fff;}
  .kycrow .knm{flex:1;font-size:11.5px;font-weight:600;}
  .kycrow .kst{font-size:9.5px;color:var(--muted);}
  .kycrow.ok .kst{color:var(--primary);font-weight:700;}
  .consent{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;color:var(--muted);margin:10px 0;cursor:pointer;}
  .consent .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--surface);}
  .consent .box.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .notice{background:var(--danger-bg);color:var(--rust);font-size:9.5px;font-weight:600;padding:7px 10px;
    border-radius:10px;margin-bottom:10px;line-height:1.45;}

  .chip-sel{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-sel button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
    padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Poppins','Noto Sans Devanagari',sans-serif;}
  .chip-sel button.on{background:var(--sage);border-color:var(--primary);color:var(--primary);}

  .fabstack{position:absolute;right:16px;bottom:78px;display:flex;flex-direction:column;gap:10px;z-index:20;align-items:center;}
  .fab2{width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:20px;box-shadow:0 8px 18px rgba(18,49,40,.38);cursor:pointer;border:none;position:relative;
    transition:transform .15s ease;}
  .fab2:active{transform:scale(.92);}
  .fab2 .ping{position:absolute;top:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--surface);}

  .chatwrap{display:flex;flex-direction:column;height:min(500px,64vh);}
  .chatbody{flex:1;overflow-y:auto;padding:4px 2px 6px;display:flex;flex-direction:column;gap:8px;}
  .bub{max-width:86%;padding:9px 12px;border-radius:15px;font-size:12px;line-height:1.55;}
  .bub.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start;}
  .bub.me{background:var(--primary);color:#fff;border-bottom-right-radius:5px;align-self:flex-end;}
  .bub b{font-weight:700;}
  .typing{display:flex;gap:4px;align-items:center;padding:11px 14px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;} .typing i:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
  .chatin{display:flex;gap:7px;align-items:center;padding-top:8px;border-top:1px solid var(--line);}
  .chatin input{flex:1;padding:10px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);
    color:var(--ink);font-size:12.5px;font-family:'Poppins','Noto Sans Devanagari',sans-serif;min-width:0;}
  .chatin input:focus{outline:none;border-color:var(--primary);}
  .sendb{width:38px;height:38px;border-radius:50%;background:var(--gold);border:none;font-size:15px;cursor:pointer;flex-shrink:0;}
  .micb{width:38px;height:38px;border-radius:50%;background:var(--sage);border:none;font-size:15px;cursor:pointer;flex-shrink:0;}
  .qchips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;}
  .qchips::-webkit-scrollbar{display:none;}
  .qchips button{flex:0 0 auto;background:var(--sage);border:none;color:var(--primary);font-size:10.5px;font-weight:600;
    padding:6px 11px;border-radius:999px;cursor:pointer;font-family:'Poppins','Noto Sans Devanagari',sans-serif;}

  .star{font-size:27px;cursor:pointer;line-height:1;background:none;border:none;padding:0 2px;}
  .switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;border:none;flex-shrink:0;}
  .switch.on{background:var(--primary);}
  .switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .22s ease;}
  .switch.on i{left:21px;}
  .notif{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);}
  .notif .nic{width:30px;height:30px;border-radius:9px;background:var(--sage);display:flex;align-items:center;
    justify-content:center;font-size:14px;flex-shrink:0;}
  .listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .listrow:last-child{border-bottom:none;}
  .listrow .lt{font-size:12.5px;font-weight:600;}
  .listrow .ld{font-size:10.5px;color:var(--muted);}

  .footer-credit{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;}
  .footer-credit b{color:var(--primary);}
</style>

/* ---------------- HELPERS ---------------- */
function sparkline(values, w, h, pad){
  pad = pad||6;
  const min=Math.min(...values), max=Math.max(...values), range=(max-min)||1;
  const stepX=(w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>[pad+i*stepX, pad+(h-2*pad)*(1-(v-min)/range)]);
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line+` L ${pts[pts.length-1][0].toFixed(1)},${h-pad} L ${pts[0][0].toFixed(1)},${h-pad} Z`;
  return {line, area};
}

function calcBulk(c, qty, distance){
  const pk = perKg(c);
  const discountPct = qty>=500?15: qty>=200?10: qty>=50?5:0;
  const subtotal = pk*qty;
  const discount = subtotal*discountPct/100;
  const afterDiscount = subtotal-discount;
  const transportRate = qty>=500?1.6: qty>=100?2.2:3.0;
  const transport = 40 + transportRate*Math.min(qty,2000)*0.15 + distance*2;
  const servicePct = 2;
  const serviceFee = afterDiscount*servicePct/100;
  const total = afterDiscount+transport+serviceFee;
  const mandiCommission = subtotal*0.08;
  const savings = discount+mandiCommission;
  return {pk,discountPct,subtotal,discount,afterDiscount,transport,serviceFee,servicePct,total,savings};
}

function nextTier(qty){
  if(qty<50) return {need:50-qty, pct:5};
  if(qty<200) return {need:200-qty, pct:10};
  if(qty<500) return {need:500-qty, pct:15};
  return null;
}

/* ---------------- AI BUYER MATCHING (rule-based demo engine) ---------------- */
function scoreBuyer(b, cropId, qty, grade){
  let s = 58;
  if(b.crops.includes(cropId)) s += 15;                     // deals in this crop
  s += Math.max(0, 11 - b.km/22);                           // proximity
  s += (Math.min(qty,b.need)/Math.max(qty,b.need))*13;      // quantity fit
  if(b.repeat) s += 6;                                      // past dealings
  if(b.pay >= 1.05) s += 5;                                 // pays above market
  if(b.grade === grade) s += 4;                             // grade requirement fit
  return Math.max(61, Math.min(97, Math.round(s)));
}
function matchReason(b, qty, hi){
  const bits = [];
  if(hi){
    bits.push(b.km<=40 ? `सिर्फ ${b.km} किमी दूर` : `${b.km} किमी — नियमित रूट पर`);
    if(b.repeat) bits.push('पहले भी आपसे खरीद चुके हैं');
    bits.push(b.need>=qty ? 'पूरी मात्रा एक साथ लेंगे' : `${b.need} किलो तक ले सकते हैं`);
    if(b.pay>=1.05) bits.push('बाज़ार भाव से ऊपर देते हैं');
    if(b.grade==='A') bits.push('ग्रेड A की मांग');
  }else{
    bits.push(b.km<=40 ? `only ${b.km} km away` : `${b.km} km, on an existing route`);
    if(b.repeat) bits.push('has bought from you before');
    bits.push(b.need>=qty ? 'can absorb your full lot' : `takes up to ${b.need} kg`);
    if(b.pay>=1.05) bits.push('pays above market rate');
    if(b.grade==='A') bits.push('demands Grade A');
  }
  return bits.join(' · ');
}
function generateMatches(cropId, qty, pricePk, grade){
  return BUYERS
    .map(b=>({...b, score:scoreBuyer(b, cropId, qty, grade||'A'), offer:+(pricePk*b.pay).toFixed(1)}))
    .sort((a,b)=>b.score-a.score)
    .slice(0, 4);
}

/* ---------------- FARMER EARNINGS vs MANDI (illustrative) ---------------- */
function earningsCalc(cropId, qty){
  const c = CROPS.find(x=>x.id===cropId);
  const pk = perKg(c);
  const gross    = pk*qty;              // price agreed on KisanSetu (farm gate)
  const platform = gross*0.02;          // capped platform fee
  const grading  = 0.30*qty;            // collection centre grading & handling
  const payout   = gross - platform - grading;
  // traditional intermediary / mandi route
  const mRate   = pk*0.88;              // realised rate after trader margin
  const mGross  = mRate*qty;
  const commission = mGross*0.06;       // arhtiya commission
  const hamali     = 0.45*qty;          // loading, unloading, weighing
  const transport  = 1.10*qty;          // farmer-borne transport to mandi
  const wastage    = mGross*0.04;       // handling / spoilage loss
  const mPayout = mGross - commission - hamali - transport - wastage;
  const extra = payout - mPayout;
  return {pk,gross,platform,grading,payout,mRate,mGross,commission,hamali,transport,wastage,mPayout,
          extra, pct: mPayout>0 ? (extra/mPayout*100) : 0};
}

/* ---------------- ROUTE / TRACKING GEOMETRY ---------------- */
function routeGeom(pct){
  const pts = ROUTE_PTS, cum=[0]; let total=0;
  for(let i=1;i<pts.length;i++){ total += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); cum.push(total); }
  const target = total*(Math.max(0,Math.min(100,pct))/100);
  let idx=1; while(idx<pts.length-1 && cum[idx]<target) idx++;
  const segLen = cum[idx]-cum[idx-1];
  const f = segLen ? (target-cum[idx-1])/segLen : 0;
  const x = pts[idx-1][0] + (pts[idx][0]-pts[idx-1][0])*f;
  const y = pts[idx-1][1] + (pts[idx][1]-pts[idx-1][1])*f;
  const done = pts.slice(0,idx).map(p=>p[0]+','+p[1]).concat([x.toFixed(1)+','+y.toFixed(1)]).join(' ');
  return {x, y, donePoints:done, allPoints:pts.map(p=>p[0]+','+p[1]).join(' ')};
}

function validateStep(step){
  const e={}, r=S.reg, f=r.role==='farmer';
  const need = (k,min,msg)=>{ if(!String(r[k]||'').trim() || String(r[k]).trim().length<min) e[k]=msg; };
  if(step===0){
    need('name',3, L('Enter your full name','अपना पूरा नाम डालें'));
    need('village',2, L('Required','आवश्यक'));
    need('district',2, L('Required','आवश्यक'));
    if(!/^\d{6}$/.test(String(r.pin||''))) e.pin = L('6-digit PIN code','6 अंकों का पिन कोड');
  }
  if(step===1){
    const digits = String(r.idNo||'').replace(/\s/g,'');
    if(r.idType==='aadhaar' && !/^\d{12}$/.test(digits)) e.idNo = L('12-digit ID number (use demo digits)','12 अंकों का नंबर (डेमो अंक डालें)');
    if(r.idType==='pan' && !/^[A-Za-z]{5}\d{4}[A-Za-z]$/.test(digits)) e.idNo = L('Format: ABCDE1234F','प्रारूप: ABCDE1234F');
    if(r.idType==='voter' && digits.length<10) e.idNo = L('Enter a valid voter ID','सही वोटर ID डालें');
    if(f){
      if(!(parseFloat(r.land)>0)) e.land = L('Enter land in acres','ज़मीन एकड़ में डालें');
      need('survey',2, L('Survey / Gat number needed','सर्वे / गट नंबर ज़रूरी'));
      if(!r.crops.length) e.crops = L('Pick at least one crop','कम से कम एक फसल चुनें');
    }else{
      need('biz',3, L('Business name required','व्यवसाय का नाम ज़रूरी'));
      if(String(r.gst||'').trim() && String(r.gst).trim().length!==15) e.gst = L('GSTIN is 15 characters','GSTIN 15 अक्षरों का होता है');
    }
  }
  if(step===2){
    need('bank',3, L('Bank name required','बैंक का नाम ज़रूरी'));
    if(!/^\d{9,18}$/.test(String(r.acc||'').replace(/\s/g,''))) e.acc = L('9–18 digit account number','9–18 अंकों का खाता नंबर');
    if(!/^[A-Za-z]{4}0[A-Za-z0-9]{6}$/.test(String(r.ifsc||'').trim())) e.ifsc = L('Format: MAHB0000512','प्रारूप: MAHB0000512');
    if(!String(r.upi||'').includes('@')) e.upi = L('UPI ID looks like name@bank','UPI ID ऐसी होती है name@bank');
    if(!r.consent) e.consent = L('Please accept to continue','जारी रखने हेतु सहमति दें');
  }
  S.reg.err = e;
  return Object.keys(e).length===0;
}
window.regNext = ()=>{
  if(!validateStep(S.auth.rstep)){ render(); showToast(L('Please fix the highlighted fields','कृपया लाल फ़ील्ड ठीक करें')); return; }
  if(S.auth.rstep<2){ S.auth.rstep++; render(); return; }
  S.auth.stage='kyc'; S.auth.kyc=0; render();
  const tick=()=>{
    S.auth.kyc++; render();
    if(S.auth.kyc<5) setTimeout(tick, 780);
    else setTimeout(()=>{ finishKyc(); }, 600);
  };
  setTimeout(tick, 700);
};
function finishKyc(){
  const r=S.reg, f=r.role==='farmer';
  S.user = {
    role:r.role, name:r.name, mobile:r.mobile||S.auth.mobile,
    place:(r.village?r.village+', ':'')+r.district, state:r.state, pin:r.pin,
    idType:r.idType, idMask:'•••• •••• '+String(r.idNo).replace(/\D/g,'').slice(-4),
    land:r.land, survey:r.survey, crops:r.crops.slice(),
    biz:r.biz, gst:r.gst, fssai:r.fssai, volume:r.volume,
    bank:r.bank, accMask:'•••• '+String(r.acc).replace(/\D/g,'').slice(-4), ifsc:r.ifsc, upi:r.upi,
    kisanId:'KS-'+(f?'FR':'BY')+'-'+String(Math.floor(100000+Math.random()*899999)),
    since:new Date().toLocaleDateString('en-IN',{month:'short',year:'numeric'}), verified:true,
  };
  S.role=r.role; S.crop=(f && r.crops[0]) ? r.crops[0] : S.crop;
  S.auth.stage='done'; S.tab='home';
  try{ localStorage.setItem('ks_user', JSON.stringify(S.user)); }catch(e){}
  render();
  showToast(L('✓ Verified. Welcome, ','✓ सत्यापित। स्वागत है, ')+S.user.name.split(' ')[0]);
}

/* ================= v3: KISANMITRA — AI ASSISTANT ================= */
function kmNorm(s){ /* \p{M} keeps Devanagari matras intact */
  return ' '+String(s).toLowerCase().replace(/[^\p{L}\p{N}\p{M}\s]/gu,' ').replace(/\s+/g,' ')+' '; }
function kmCrop(q){
  const n = kmNorm(q);
  for(const c of CROPS){
    const keys = [c.name.toLowerCase(), c.hi, ...(c.alt||[])];
    if(keys.some(k=>k && n.includes(String(k).toLowerCase()))) return c;
  }
  return null;
}
function kmQty(q){ const m = String(q).match(/(\d{2,5})\s*(kg|किलो|kilo|quintal|क्विंटल)?/i); return m?parseInt(m[1]):null; }
function trendText(c){
  const up = c.price>=c.prev, pct = Math.abs((c.price-c.prev)/c.prev*100).toFixed(1);
  return {up, pct};
}
function actBtn(label, fn){ return `<button class="btn btn-outline" style="margin-top:8px;font-size:11px;padding:8px 10px;" onclick="${fn}">${label}</button>`; }

{id:'weather', kw:['weather','rain','mausam','मौसम','बारिश','barish','temperature','garmi','गर्मी','forecast'],
 a:()=>({en:`Nashik region today: clear, around 32°C, light breeze — good for harvesting and pickup.\n• Harvest in the cooler morning hours to reduce field heat.\n• If rain is expected, cover the lot and inform the collection centre early so pickup is re-slotted.\nThis demo shows sample weather; the live app would use IMD data.`,
        hi:`नाशिक क्षेत्र आज: साफ़ मौसम, लगभग 32°C, हल्की हवा — कटाई व पिकअप के लिए अच्छा।\n• सुबह ठंडे समय कटाई करें ताकि माल गर्म न हो।\n• बारिश की संभावना हो तो माल ढकें और सेंटर को पहले बताएं ताकि पिकअप का समय बदला जा सके।\nयह डेमो नमूना मौसम दिखाता है; असली ऐप IMD डेटा लेगा।`})},

{id:'pest', kw:['pest','disease','insect','keeda','कीड़ा','रोग','बीमारी','fungus','blight','kharab ho','पत्ते पीले','yellow leaves','sukh raha','मुरझा','virus','ilaj','इलाज'],
 a:(q,c)=>({en:`Common problems in **${c.name}**: ${c.pest.en}.\n🌱 First steps: remove and destroy affected plants, avoid watering the leaves, rotate crops next season, use pheromone or sticky traps, and neem-based sprays early.\n${c.care.en}\n⚠️ For any chemical dose, please confirm with your **KVK or block agriculture officer** — the right dose depends on the stage and severity.`,
         hi:`**${c.hi}** में आम समस्याएँ: ${c.pest.hi}।\n🌱 पहले कदम: प्रभावित पौधे हटाकर नष्ट करें, पत्तियों पर पानी न डालें, अगली बार फसल चक्र अपनाएं, फेरोमोन/चिपचिपे ट्रैप लगाएं और शुरुआत में नीम आधारित छिड़काव करें।\n${c.care.hi}\n⚠️ किसी भी दवा की मात्रा के लिए **KVK या कृषि अधिकारी** से पुष्टि जरूर करें — सही मात्रा अवस्था और गंभीरता पर निर्भर करती है।`})},

{id:'schemes', kw:['scheme','yojana','योजना','subsidy','सब्सिडी','pm kisan','pmfby','insurance','बीमा','सरकारी','government','kisan samman','soil health'],
 a:()=>({en:`Key central schemes worth checking:\n• **PM-KISAN** — ₹6,000/year to eligible landholding farmers in 3 instalments.\n• **PMFBY** — crop insurance at a low farmer premium (2% kharif, 1.5% rabi, 5% horticulture).\n• **Kisan Credit Card** — short-term credit at subsidised interest.\n• **Soil Health Card** — free soil testing and nutrient advice.\n• **e-NAM** — online mandi trading; KisanSetu centres are e-NAM linked.\nEligibility and amounts change, so confirm on the official portal or at your CSC.`,
        hi:`काम की मुख्य केंद्रीय योजनाएँ:\n• **पीएम-किसान** — पात्र किसानों को ₹6,000/वर्ष, तीन किस्तों में।\n• **पीएमएफबीवाई** — कम प्रीमियम पर फसल बीमा (खरीफ 2%, रबी 1.5%, बागवानी 5%)।\n• **किसान क्रेडिट कार्ड** — कम ब्याज पर अल्पकालिक कर्ज।\n• **सॉइल हेल्थ कार्ड** — मुफ्त मिट्टी जांच व पोषक सलाह।\n• **e-NAM** — ऑनलाइन मंडी; किसानसेतु सेंटर e-NAM से जुड़े हैं।\nपात्रता व राशि बदलती रहती है — आधिकारिक पोर्टल या CSC पर पुष्टि करें।`})},

{id:'loan', kw:['loan','credit','karz','कर्ज','ऋण','kcc','किसान क्रेडिट','byaj','ब्याज','udhar','उधार'],
 a:()=>({en:`For working capital, the **Kisan Credit Card (KCC)** is usually the cheapest formal option — short-term crop loans at subsidised interest, with a further rebate for on-time repayment.\n• Apply at your bank branch or through the PM-KISAN portal.\n• Keep land records, ID and a passbook ready.\n• A verified KisanSetu payout history also helps show steady income to the bank.\nCompare terms at the bank before signing; avoid informal high-interest lending.`,
        hi:`कार्यशील पूंजी के लिए **किसान क्रेडिट कार्ड (KCC)** आमतौर पर सबसे सस्ता औपचारिक विकल्प है — कम ब्याज पर अल्पकालिक फसल ऋण, समय पर चुकाने पर अतिरिक्त छूट।\n• बैंक शाखा या पीएम-किसान पोर्टल से आवेदन करें।\n• भूमि रिकॉर्ड, पहचान पत्र व पासबुक तैयार रखें।\n• किसानसेतु का सत्यापित भुगतान रिकॉर्ड बैंक को नियमित आमदनी दिखाने में मदद करता है।\nहस्ताक्षर से पहले शर्तें जरूर तुलना करें; ऊंचे ब्याज वाले अनौपचारिक कर्ज से बचें।`})},

{id:'storage', kw:['storage','store','bhandaran','भंडारण','cold storage','रखना','kharab','सड़','spoil','shelf life','godown','गोदाम'],
 a:(q,c)=>({en:`Post-harvest care for **${c.name}**:\n${c.care.en}\n• Harvest early morning and keep the lot shaded — field heat is the biggest cause of loss.\n• Use crates instead of loose sacks to avoid bruising.\n• Grade before storing: one spoiled unit spreads fast.\nKisanSetu pickup is usually within 24 hours, so long storage is rarely needed.`,
         hi:`**${c.hi}** की कटाई के बाद देखभाल:\n${c.care.hi}\n• सुबह जल्दी कटाई करें और माल छाया में रखें — खेत की गर्मी सबसे बड़ा नुकसान करती है।\n• बोरी की जगह क्रेट इस्तेमाल करें ताकि माल दबे नहीं।\n• रखने से पहले छंटाई करें: एक सड़ा फल बाकी को जल्दी खराब करता है।\nकिसानसेतु पिकअप आमतौर पर 24 घंटे में हो जाता है, इसलिए लंबे भंडारण की जरूरत कम पड़ती है।`})},

{id:'water', kw:['irrigation','water','sinchai','सिंचाई','पानी','drip','tapak','ड्रिप','watering'],
 a:(q,c)=>({en:`Water management for **${c.name}**: ${c.season.en}.\n💧 Drip irrigation typically saves a large share of water and keeps the root zone even, which improves grading consistency.\n• Water at the critical growth stages rather than fixed days.\n• Avoid waterlogging — it invites root rot and downgrades your lot.\n• Micro-irrigation subsidy is available in most states; ask at your agriculture office.`,
         hi:`**${c.hi}** में जल प्रबंधन: ${c.season.hi}।\n💧 ड्रिप सिंचाई से पानी की काफी बचत होती है और जड़ क्षेत्र एक-सा रहता है, जिससे ग्रेडिंग बेहतर मिलती है।\n• तय दिनों की जगह फसल की महत्वपूर्ण अवस्थाओं पर सिंचाई करें।\n• पानी न रुकने दें — जड़ सड़न होती है और ग्रेड गिरता है।\n• अधिकतर राज्यों में सूक्ष्म सिंचाई पर सब्सिडी मिलती है; कृषि कार्यालय से पूछें।`})},

{id:'soil', kw:['fertilizer','urea','khad','खाद','उर्वरक','soil','mitti','मिट्टी','npk','dap','compost','organic','जैविक','nutrient'],
 a:()=>({en:`Start with a **soil test** — free under the Soil Health Card scheme — instead of guessing doses.\n• Apply nutrients in splits rather than one heavy dose.\n• Add organic matter (FYM/compost/green manure) every season; it improves yield stability more than extra urea.\n• Over-applying urea raises cost, invites pests and can lower grade.\nYour KVK can convert the soil report into a crop-wise plan.`,
        hi:`अंदाज़े से मात्रा डालने के बजाय पहले **मिट्टी जांच** कराएं — सॉइल हेल्थ कार्ड योजना में मुफ्त।\n• पोषक तत्व एक साथ नहीं, किस्तों में दें।\n• हर मौसम जैविक खाद (गोबर/कम्पोस्ट/हरी खाद) डालें; यह अतिरिक्त यूरिया से ज्यादा फायदा देती है।\n• ज्यादा यूरिया से लागत बढ़ती है, कीट आते हैं और ग्रेड गिर सकता है।\nKVK मिट्टी रिपोर्ट को फसलवार योजना में बदल देगा।`})},

{id:'bulk', kw:['bulk','discount','thok','थोक','छूट','wholesale','minimum order','tier','bada order','बड़ा ऑर्डर'],
 a:()=>({en:`Bulk buying tiers (buyer side):\n• 50 kg+ → 5% off\n• 200 kg+ → 10% off\n• 500 kg+ → 15% off\nTransport per kg also falls as the load grows, and the calculator shows the exact landed cost before payment.`,
        hi:`थोक खरीद की छूट (खरीदार के लिए):\n• 50 किलो+ → 5% छूट\n• 200 किलो+ → 10% छूट\n• 500 किलो+ → 15% छूट\nमात्रा बढ़ने पर प्रति किलो ढुलाई भी घटती है, और कैलकुलेटर भुगतान से पहले पूरा खर्च दिखा देता है।`,
        act: actBtn(L('Open calculator','कैलकुलेटर खोलें'), `closeChat();setRole('buyer');setTab('market');setMktTab('spot')`)})},

{id:'kyc', kw:['kyc','verify','verification','registration','पंजीकरण','सत्यापन','aadhaar','आधार','document','कागज','account banana','खाता','profile'],
 a:()=>({en:`Verification keeps fake buyers and brokers out:\n📱 Mobile OTP → 🆔 ID e-KYC → 🌾 land record (7/12) or business registration → 🏦 bank penny-drop → 🏛️ e-NAM linking.\nOnce done you get a **KisanSetu ID** and a verified badge, which buyers can see.\nKeep your ID, land paper and passbook handy. In this demo, nothing is stored or sent anywhere.`,
        hi:`सत्यापन से नकली खरीदार व दलाल बाहर रहते हैं:\n📱 मोबाइल OTP → 🆔 ID e-KYC → 🌾 भूमि रिकॉर्ड (7/12) या व्यवसाय पंजीकरण → 🏦 बैंक जांच → 🏛️ e-NAM लिंक।\nपूरा होने पर आपको **किसानसेतु ID** और सत्यापित बैज मिलता है, जो खरीदार देख सकते हैं।\nID, भूमि कागज व पासबुक पास रखें। इस डेमो में कुछ भी सहेजा या भेजा नहीं जाता।`})},

{id:'support', kw:['help','helpline','support','complaint','shikayat','शिकायत','मदद','हेल्पलाइन','call','फोन','problem','samasya','समस्या','dispute'],
 a:()=>({en:`I can help right here, and humans are available too:\n📞 **1800-11-KISAN** — toll-free, 24×7, in your language.\n💬 WhatsApp support from the Safety tab.\n⚖️ If a lot is rejected or a payment is disputed, the escrow money stays frozen until the case is settled — neither side can walk away with it.`,
        hi:`मैं यहीं मदद कर सकता हूँ, और इंसानी सहायता भी उपलब्ध है:\n📞 **1800-11-KISAN** — टोल-फ्री, 24×7, आपकी भाषा में।\n💬 सुरक्षा टैब से व्हाट्सएप सहायता।\n⚖️ माल अस्वीकार या भुगतान विवाद की स्थिति में एस्क्रो की रकम मामला सुलझने तक रुकी रहती है — कोई भी पक्ष उसे नहीं ले सकता।`,
        act: actBtn(L('Open Safety','सुरक्षा खोलें'), `closeChat();setTab('safety')`)})},

{id:'about', kw:['what is kisansetu','about','how does this work','kya hai','क्या है','कैसे काम','kaise kaam','why use','fayda','फायदा','benefit'],
 a:()=>({en:`**KisanSetu** connects farmers directly to verified bulk buyers.\n• AI matches your listing with buyers by distance, demand and price.\n• A verified collection centre weighs and grades the lot transparently.\n• Shared logistics cuts transport cost; live tracking shows where it is.\n• Escrow + OTP means the farmer is paid the same day, in full, with no commission agent in between.\nThat is the whole idea: fewer cuts, faster money, full visibility.`,
        hi:`**किसानसेतु** किसानों को सीधे सत्यापित थोक खरीदारों से जोड़ता है।\n• AI आपकी सूची को दूरी, मांग व भाव के आधार पर खरीदारों से मिलाता है।\n• सत्यापित कलेक्शन सेंटर पारदर्शी तरीके से तौल व ग्रेडिंग करता है।\n• साझा ढुलाई से खर्च घटता है; लाइव ट्रैकिंग से माल की जगह दिखती है।\n• एस्क्रो + OTP से किसान को उसी दिन पूरा भुगतान, बिना किसी दलाल के।\nयही पूरा विचार है: कम कटौती, तेज़ भुगतान, पूरी पारदर्शिता।`})},

{id:'bestcrop', kw:['which crop','what to grow','kaun si fasal','कौन सी फसल','उगाऊं','ugaun','sow','buvai','बुवाई','plan','next season','अगली फसल'],
 a:()=>{ const rising = CROPS.filter(c=>c.price>=c.prev).slice(0,3);
   return {en:`I cannot predict markets, but here is what the data shows:\n📈 Firming this week: ${rising.map(c=>c.emoji+' '+c.name).join(', ')}.\nBefore deciding, weigh: your soil and water, how long the crop occupies the field, labour at harvest, and how quickly it spoils.\nA **Future Harvest** listing is the safer route — fix a buyer and price first, then sow.\nYour KVK can advise on varieties suited to your block.`,
           hi:`मैं बाज़ार की भविष्यवाणी नहीं कर सकता, पर आंकड़े यह दिखाते हैं:\n📈 इस हफ्ते मजबूत: ${rising.map(c=>c.emoji+' '+c.hi).join(', ')}।\nतय करने से पहले देखें: आपकी मिट्टी व पानी, फसल कितने दिन खेत रोकेगी, कटाई पर मजदूरी, और कितनी जल्दी खराब होती है।\n**भविष्य फसल** सूची सुरक्षित रास्ता है — पहले खरीदार व भाव तय करें, फिर बुवाई।\nअपने क्षेत्र के लिए उपयुक्त किस्म हेतु KVK से सलाह लें।`};}},

{id:'lang', kw:['hindi','english','language','bhasha','भाषा','हिंदी में','in hindi','अंग्रेजी'],
 a:()=>({en:`I speak Hindi and English. Tap **हिं** at the top of the app, or ask me in Hindi any time — I will reply in the same language.`,

 a:()=>({en:`Happy to help 🙏 Ask me any time — prices, pests, schemes or your order.\nGood luck with the harvest!`,
        hi:`सेवा का मौका देने के लिए धन्यवाद 🙏 कभी भी पूछें — भाव, कीट-रोग, योजना या ऑर्डर।\nआपकी फसल अच्छी हो!`})},

function kmReply(q){
  const n = kmNorm(q), c = kmCrop(q) || crop();
  let best=null, bs=0;
  for(const it of KM){
    let sc=0;
    for(const k of it.kw){
      const kk=String(k).toLowerCase();
      if(kk.length<=3){ if(n.includes(' '+kk+' ')) sc+=1.6; }
      else if(n.includes(kk)) sc += (kk.length>=7?2.6:2.0);
    }
    if(sc>bs){ bs=sc; best=it; }
  }
  if(best && bs>=1.6){ const r = best.a(q, c); return {txt:r[S.lang], act:r.act||''}; }
  if(kmCrop(q)){ const r = KM.find(i=>i.id==='price').a(q, c); return {txt:r[S.lang], act:r.act||''}; }
  return {txt:L(`I did not catch that. I can help with:\n• today's price and when to sell\n• listing produce or future harvest\n• fees, escrow, OTP and delivery\n• pests, soil, water, storage\n• government schemes and KCC\n• your current order status`,
                `मैं समझ नहीं पाया। मैं इनमें मदद कर सकता हूँ:\n• आज का भाव और कब बेचें\n• फसल सूची या भविष्य फसल\n• शुल्क, एस्क्रो, OTP व डिलीवरी\n• कीट-रोग, मिट्टी, पानी, भंडारण\n• सरकारी योजनाएँ व KCC\n• आपके ऑर्डर की स्थिति`), act:''};
}

/* ---- assistant UI ---- */
window.openChat = ()=>{
  S.chat.open=true; S.chat.seen=true;
  if(!S.chat.msgs.length){
    S.chat.msgs.push({me:false, txt:L(`Namaste 🙏 I am **KisanMitra**, your KisanSetu assistant.\nAsk me about prices, when to sell, pests, schemes, fees — or tap a suggestion below.`,
                                      `नमस्ते 🙏 मैं **किसानमित्र** हूँ, आपका किसानसेतु सहायक।\nभाव, कब बेचें, कीट-रोग, योजना, शुल्क — कुछ भी पूछें या नीचे से चुनें।`), act:''});
  }
  render();
};
window.closeChat = ()=>{ S.chat.open=false; render(); };
window.chatDraft = (v)=>{ S.chat.draft = v; };
window.chatClear = ()=>{ S.chat.msgs=[]; S.chat.draft=''; openChat(); };
window.chatSend = ()=>{
  const q = (S.chat.draft||'').trim();
  if(!q) return;
  S.chat.msgs.push({me:true, txt:q});
  S.chat.draft=''; S.chat.typing=true; render();

    const r = kmReply(q);
    S.chat.typing=false; S.chat.msgs.push({me:false, txt:r.txt, act:r.act});
    render();
  }, 620 + Math.random()*420);
};

function stamp(i){ const m = 9*60+41 + i*14; const h=Math.floor(m/60)%24, mm=m%60;
  return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }

function orderStepper(order){
  return `<div class="stepper">${STEP_DEFS.map((s,i)=>{
    const done = i<order.step, active = i===order.step;
    return `<div class="step ${done?'done':''} ${active?'active':''}">
      <div class="connector"></div>
      <div class="stepdot">${done?'✓':s.ic}</div>
      <div class="steptext" style="flex:1;">
        <div class="row"><div class="t">${s.t[S.lang]}</div>
          ${done?`<div style="font-size:9.5px;color:var(--muted);">${stamp(i)}</div>`
                :active?`<span class="badge gold">${S.lang==='hi'?'अभी':'Now'}</span>`:''}</div>
        <div class="d">${s.d[S.lang]}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function stageAction(o){
  switch(o.step){
    case 0: return {lb:'👨\u200d🌾 '+(S.role==='farmer'?t('acceptB'):t('acceptDemo')), fn:'acceptOrder()'};
    case 1: return {lb:'🏪 '+t('toCCB'), fn:'toCollectionCentre()'};
    case 2: return o.cc.state==='done' ? {lb:'✅ '+t('confirmVer'), fn:'ccConfirm()'} : null;
    case 3: return {lb:'🚚 '+t('dispatchB'), fn:'dispatchOrder()'};
    case 4: return {lb:'📍 '+t('startRun'), fn:'startTracking()'};
    default: return null;
  }
}

  </div>`;
}
window.dismissSplash = ()=>{ S.splash=false; render(); };

/* ---------------- MAIN RENDER ---------------- */
function render(){
  const phone = document.getElementById('phone');
  const viewKey = S.auth.stage+'|'+S.auth.rstep+'|'+S.tab+'|'+S.role+'|'+S.mktTab+'|'+S.lang;
  const viewChanged = S.__viewKey !== viewKey;

  /* preserve caret and scroll so re-renders never jump the screen */
  const ae = document.activeElement;
  const focusId = (ae && ae.id && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) ? ae.id : null;
  let caret = null;
  if(focusId){ try{ caret = ae.selectionStart; }catch(e){} }
  const prevContent = phone.querySelector('.content');
  const scrollTop = prevContent ? prevContent.scrollTop : 0;
  const prevModal = phone.querySelector('.modal');
  const modalTop = prevModal ? prevModal.scrollTop : 0;

  const authed = S.auth.stage==='done';
  let body = '';
  if(authed){
    if(S.tab==='home') body = screenHome();
    else if(S.tab==='market') body = screenMarket();
    else if(S.tab==='orders') body = screenOrders();
    else if(S.tab==='safety') body = screenSafety();
    else body = screenProfile();
  }

  phone.innerHTML = `
    <div class="statusbar"><span>9:41</span><div class="dot-row"></div><span>●●● 4G</span></div>
    ${authed ? `
      ${header()}
      <div class="content${viewChanged?' anim':''}">${body}</div>
      ${fab()}
      ${bottomNav()}
      ${addModal()}
      ${matchModal()}
      ${reserveModal()}
      ${chatSheet()}
      ${notifSheet()}
      ${traceSheet()}
      ${tutSheet()}
      ${bankSheet()}
      ${schemeSheet()}
      ${rateSheet()}
      ${demoBanner()}
    ` : screenAuth()}
    ${toastHtml()}
    ${S.splash ? splashHtml() : ''}
  `;

  const content = phone.querySelector('.content');
  if(content && scrollTop && !viewChanged) content.scrollTop = scrollTop;
  const modal = phone.querySelector('.modal');
  if(modal && modalTop) modal.scrollTop = modalTop;
  S.__viewKey = viewKey;

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){ el.focus(); if(caret!=null){ try{ el.setSelectionRange(caret, caret); }catch(e){} } }
  }
  const cb = document.getElementById('chatBody');
  if(cb) cb.scrollTop = cb.scrollHeight;

  requestAnimationFrame(()=>{
    document.querySelectorAll('.spark-line').forEach(p=>{ p.style.strokeDashoffset = '0'; });
    document.querySelectorAll('[data-w]').forEach(el=>{ el.style.width = el.getAttribute('data-w')+'%'; });
    document.querySelectorAll('[data-h]').forEach(el=>{ el.style.height = el.getAttribute('data-h')+'px'; });
    /* count up only when the screen actually changes, never on every tap */
    if(!viewChanged) return;
    document.querySelectorAll('.count').forEach(elm=>{
      const target = parseInt(elm.getAttribute('data-target'))||0;
      let cur = 0; const step = Math.max(1, Math.round(target/24));
      const timer = setInterval(()=>{
        cur += step;
        if(cur>=target){ cur=target; clearInterval(timer); }
        elm.textContent = (target>1000? '₹':'') + cur.toLocaleString('en-IN');
      }, 20);
    });
  });
}

loadUser();
try{ if(S.theme!=='auto') document.documentElement.setAttribute('data-theme', S.theme); }catch(e){}
render();
